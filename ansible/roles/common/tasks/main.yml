---
# Common Role Tasks
# NIST 800-53 Compliance and Zero Trust Architecture

- name: Update system packages
  package:
    name: "*"
    state: latest
  when: ansible_os_family != "Windows"

- name: Update Windows system
  win_updates:
    category_names:
      - SecurityUpdates
      - CriticalUpdates
      - UpdateRollups
  when: ansible_os_family == "Windows"

- name: Set timezone
  timezone:
    name: UTC
  when: ansible_os_family != "Windows"

- name: Set Windows timezone
  win_timezone:
    timezone: UTC
  when: ansible_os_family == "Windows"

- name: Configure NTP servers
  template:
    src: ntp.conf.j2
    dest: /etc/ntp.conf
    owner: root
    group: root
    mode: '0644'
  when: ansible_os_family != "Windows"

- name: Configure Windows time synchronization
  win_service:
    name: w32time
    start_mode: auto
    state: started
  when: ansible_os_family == "Windows"

- name: Create security directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0750'
    owner: root
    group: root
  loop:
    - /etc/security
    - /var/log/audit
    - /etc/monitoring
  when: ansible_os_family != "Windows"

- name: Create Windows security directories
  win_file:
    path: "{{ item }}"
    state: directory
  loop:
    - C:\ProgramData\Security
    - C:\ProgramData\Monitoring
    - C:\ProgramData\Logs
  when: ansible_os_family == "Windows"

- name: Configure system limits
  template:
    src: limits.conf.j2
    dest: /etc/security/limits.conf
    owner: root
    group: root
    mode: '0644'
  when: ansible_os_family != "Windows"

- name: Configure Windows system limits
  win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management
    name: ClearPageFileAtShutdown
    data: 1
    type: dword
  when: ansible_os_family == "Windows"

- name: Install security tools
  package:
    name:
      - fail2ban
      - rkhunter
      - chkrootkit
      - lynis
    state: present
  when: ansible_os_family != "Windows"

- name: Install Windows security tools
  win_package:
    name: "{{ item }}"
    state: present
  loop:
    - WindowsDefender
    - WindowsFirewall
  when: ansible_os_family == "Windows"

- name: Configure system logging
  template:
    src: rsyslog.conf.j2
    dest: /etc/rsyslog.conf
    owner: root
    group: root
    mode: '0644'
  when: ansible_os_family != "Windows"

- name: Configure Windows event logging
  win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\EventLog\Security
    name: MaxSize
    data: 1048576
    type: dword
  when: ansible_os_family == "Windows"

- name: Restart rsyslog service
  service:
    name: rsyslog
    state: restarted
  when: ansible_os_family != "Windows"

- name: Restart Windows Event Log service
  win_service:
    name: EventLog
    state: restarted
  when: ansible_os_family == "Windows" 